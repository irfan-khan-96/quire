[package]
name = "quire"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "A Cargo-like build tool and package manager for LaTeX"
license = "MIT OR Apache-2.0"
repository = "https://github.com/irfan-khan-96/quire"
homepage = "https://irfan-khan-96.github.io/quire/"
readme = "README.md"
keywords = ["latex", "tex", "build-tool", "package-manager", "arxiv"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.1"
toml_edit = "0.25.19"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
