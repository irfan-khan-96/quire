name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }}${{ matrix.tex && ', with TeX' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs the full suite, including real LaTeX builds.
          - os: ubuntu-latest
            tex: true
          # macOS and Windows cover paths, file locks and git; the tests that
          # need latexmk skip themselves there.
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TeX Live
        if: matrix.tex
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-extra
      - run: cargo test --locked
        env:
          # Where TeX is installed, tests that need it must run, not skip.
          QUIRE_REQUIRE_TEX: ${{ matrix.tex && '1' || '' }}

  action:
    name: GitHub Action on the example project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build the PDF
        id: build
        uses: ./
        with:
          version: source
          working-directory: examples/paper
          artifact-name: example-pdf
      - name: Pack for arXiv
        id: pack
        uses: ./
        with:
          version: source
          command: pack
          tex: none
          working-directory: examples/paper
          artifact-name: example-arxiv
      - name: Check the outputs
        run: |
          ls -l ${{ steps.build.outputs.path }} ${{ steps.pack.outputs.path }}
          unzip -l ${{ steps.pack.outputs.path }} | grep -q lab-style.sty

  docs:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
