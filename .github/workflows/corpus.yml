name: Corpus

# Builds a few hundred real arXiv papers with quire (corpus/README.md).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "corpus/**"
      - ".github/workflows/corpus.yml"

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SHARDS: 6

jobs:
  build:
    name: Build quire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: quire-binary
          path: target/release/quire
          retention-days: 3

  # One job downloads every source, one request at a time: six shards
  # downloading in parallel get rate limited by arXiv. Each run saves a new
  # cache entry built on the previous one, so only new or failed papers are
  # fetched again.
  fetch:
    name: Fetch arXiv sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: corpus/cache
          key: corpus-sources-${{ hashFiles('corpus/papers.txt') }}-${{ github.run_id }}
          restore-keys: |
            corpus-sources-${{ hashFiles('corpus/papers.txt') }}-
            corpus-sources-
      - run: python3 corpus/run.py --fetch-only

  corpus:
    name: Papers (shard ${{ matrix.shard }})
    needs: [build, fetch]
    runs-on: ubuntu-latest
    # The full TeX Live, so failures are quire's or the paper's, not missing packages.
    container: texlive/texlive:latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quire-binary
          path: bin
      - name: Install Python
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: Restore arXiv sources
        uses: actions/cache/restore@v4
        with:
          path: corpus/cache
          key: corpus-sources-${{ hashFiles('corpus/papers.txt') }}-${{ github.run_id }}
          restore-keys: corpus-sources-${{ hashFiles('corpus/papers.txt') }}-
      - name: Run
        run: |
          chmod +x bin/quire
          python3 corpus/run.py --quire bin/quire --shard ${{ matrix.shard }}/$SHARDS --jobs 2 \
            --out results-${{ matrix.shard }}.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-results-${{ matrix.shard }}
          path: results-${{ matrix.shard }}.json
          retention-days: 14

  report:
    name: Report
    needs: corpus
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: corpus-results-*
          merge-multiple: true
      # Fails on quire failures that are not in corpus/known-issues.txt.
      - run: python3 corpus/run.py --merge results-*.json --summary "$GITHUB_STEP_SUMMARY"
